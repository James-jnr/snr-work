services:
  - type: web
    name: snr-storyline
    runtime: python
    plan: starter            # free plan sleeps after 15 min idle; starter stays awake
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: DISPLAY_TZ
        value: UTC
      - key: MIN_GRADE
        value: B
      - key: UI_PUBLIC
        value: "false"      # on Render the web UI must need the API key
      # NOTE: snr.db and setups/ are wiped on every restart/redeploy unless you attach a
      # persistent disk (Render > Disks) and set DB_PATH / SETUPS_DIR to paths on it.
